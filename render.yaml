services:
  - type: web
    name: mech-engineer-soft
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install -g pnpm@9.0.0 && pnpm run build:render
    startCommand: pnpm run start:render
    healthCheckPath: /api/healthz
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
      - key: COREPACK_ENABLE_NETWORK
        value: "0"
      - key: COREPACK_ENABLE_STRICT
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: mes-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_AUTH_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: BASE_PATH
        value: "/"

databases:
  - name: mes-db
    plan: free
    region: singapore
    databaseName: mesdb
    user: mesadmin
    ipAllowList: []
