services:
  - type: web
    name: mech-engineer-soft
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && corepack prepare pnpm@9.0.0 --activate && pnpm run build:render
    startCommand: pnpm run start:render
    healthCheckPath: /api/healthz
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mes-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
        sync: false
      - key: ADMIN_AUTH_SECRET
        generateValue: true
        sync: false
      - key: SESSION_SECRET
        generateValue: true
        sync: false
      - key: BASE_PATH
        value: "/"
      - key: VITE_SITE_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: VITE_PHONE_NUMBER
        sync: false
      - key: VITE_WHATSAPP_NUMBER
        sync: false

databases:
  - name: mes-db
    plan: free
    region: singapore
    databaseName: mesdb
    user: mesadmin
    ipAllowList: []
